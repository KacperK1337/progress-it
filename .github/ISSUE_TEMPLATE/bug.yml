name: Bug
description: To use if something doesn't work and needs a fix
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: 'Description'
      placeholder: Describe shortly the problem
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 'Steps to reproduce'
      placeholder: |
        1. Click "Add new"
        2. Create an hours bar
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 'Operating system'
      multiple: true
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 'App version'
      placeholder: e.g. '0.1.0' or 'latest', if multiple - please specify
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 'Additional info'
      placeholder: Anything else important for this issue
