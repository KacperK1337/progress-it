name: Bug report
description: Use if something doesn't work and needs a fix.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: 'Description'
      description: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 'Steps to reproduce'
      placeholder: |
        1. Click "Add new"
        2. Create an hours bar
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 'Operating system'
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Progress It version
      placeholder: e.g. '0.1.0' or 'latest'
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional info
      description: Anything else that helps (screenshots, screen recordings, error messages etc).
