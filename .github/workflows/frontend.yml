# Frontend (Svelte + TypeScript) checks: formatting, lint, type check and tests.
# Runs on every pull request, and again on main so the merged result is checked too.
name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR (or to main) cancels the older run.
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Svelte (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Test (Vitest)
        run: npm test
